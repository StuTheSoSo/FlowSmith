plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.stuschwartz.flowsmith'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.stuschwartz.flowsmith"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

    }

    signingConfigs {
      release {
        if (keystorePropertiesFile.exists()) {
          storeFile rootProject.file('app').toPath().resolve(keystoreProperties['storeFile']).toFile()
          storePassword keystoreProperties['storePassword']
          keyAlias keystoreProperties['keyAlias']
          keyPassword keystoreProperties['keyPassword']
        }
      }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        if (keystorePropertiesFile.exists()) {
          signingConfig signingConfigs.release
        }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
      jvmTarget = '11'
    }
  useLibrary('wear-sdk')
  buildFeatures {
    compose true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation platform('androidx.compose:compose-bom:2024.09.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.wear.compose:compose-material3:1.5.6'
  implementation 'androidx.wear.compose:compose-foundation:1.5.6'
  implementation 'androidx.wear.compose:compose-ui-tooling:1.5.6'
  implementation 'androidx.wear:wear-tooling-preview:1.0.0'
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.core:core-splashscreen:1.2.0'
  androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation 'androidx.compose.ui:ui-tooling'
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
